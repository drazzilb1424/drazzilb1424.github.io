<!DOCTYPE html>
<html lang="en">

<head>
   <!-- Google tag (gtag.js) -->
   <script async src="https://www.googletagmanager.com/gtag/js?id=G-0D7YH8NJZZ"></script>
   <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
         dataLayer.push(arguments);
      }

      gtag('js', new Date());
      gtag('config', 'G-0D7YH8NJZZ');
   </script>

   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />

   <title>Slab Guard Preview</title>

   <link rel="stylesheet" href="../css/style.css" />
   <link rel="stylesheet" href="../css/slab-guard-preview.css" />

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

   <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />

   <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet" />
   <script src="/submissions-js/search.js"></script>
</head>

<body class="fade-in">

   <!-- HEADER -->
   <div id="navbar-placeholder"></div>

   <script>
      fetch('../header.html')
         .then(response => {
            if (!response.ok) {
               throw new Error('Header failed to load');
            }

            return response.text();
         })
         .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
         })
         .catch(error => {
            console.error(error);
         });
   </script>
   <!-- END HEADER -->

   <main class="slab-preview-page">

      <input id="slabUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden />

      <header class="slab-preview-hero">
         <div>
            <h1>Slab Guard Preview</h1>
         </div>
      </header>

      <section class="slab-preview-shell">

         <!-- <aside class="slab-preview-panel slab-preview-controls"> -->
         <!-- <div class="slab-preview-actions"> -->
         <button id="downloadBtn" class="slab-preview-button slab-preview-primary" type="button">
            Download Preview
         </button>
         <!-- </div> -->
         <!-- </aside> -->

         <section class="slab-preview-panel slab-preview-card">
            <div class="slab-preview-header">
               <h2>Preview</h2>

               <span>
                  We recommend using scans provided directly by the grading
                  company for the most accurate preview.
               </span>
            </div>

            <div class="slab-preview-stage">
               <canvas id="previewCanvas" width="700" height="1000"></canvas>
            </div>
         </section>

         <section class="slab-preview-panel slab-preview-colors">
            <div class="slab-preview-label-row">
               <span>Guard color</span>
               <span class="slab-preview-value" id="hexValue">
                  White
               </span>
            </div>

            <!-- <input id="guardColor" type="color" value="#FFFFFF" /> -->

            <div class="slab-preview-swatches" id="swatches">
               <button class="slab-preview-swatch starlight" data-color="#627B79" data-name="Starlight"></button>
               <button class="slab-preview-swatch galaxy" data-color="#4B4D8E" data-name="Galaxy Blue"></button>

               <button class="slab-preview-swatch white" data-color="#FFFFFF" data-name="White"
                  style="background:#FFFFFF;"></button>

               <button class="slab-preview-swatch black" data-color="#212528" data-name="Black"
                  style="background:#212528;"></button>

               <button class="slab-preview-swatch blue" data-color="#4D91D8" data-name="Blue"
                  style="background:#4D91D8;"></button>

               <button class="slab-preview-swatch green" data-color="#5EBE73" data-name="Green"
                  style="background:#5EBE73;"></button>

               <button class="slab-preview-swatch red" data-color="#D23E3E" data-name="Red"
                  style="background:#D23E3E;"></button>

               <button class="slab-preview-swatch purple" data-color="#AD91DB" data-name="Purple"
                  style="background:#AD91DB;"></button>

               <button class="slab-preview-swatch orange" data-color="#FE8D47" data-name="Orange"
                  style="background:#FE8D47;"></button>

               <button class="slab-preview-swatch yellow" data-color="#EFD55C" data-name="Yellow"
                  style="background:#EFD55C;"></button>

               <button class="slab-preview-swatch peanut" data-color="#C89E7E" data-name="Peanut"
                  style="background:#C89E7E;"></button>

            </div>
         </section>

         <section class="slab-preview-panel slab-preview-adjustments">
            <div class="slab-preview-label-row">
               <label for="zoom">Slab zoom</label>
               <span class="slab-preview-value" id="zoomValue">100%</span>
            </div>

            <input id="zoom" type="range" min="75" max="150" value="100" />

            <div class="slab-preview-label-row slab-preview-spaced">
               <label for="offsetX">Horizontal position</label>
               <span class="slab-preview-value" id="offsetXValue">0</span>
            </div>

            <input id="offsetX" type="range" min="-120" max="120" value="0" />

            <div class="slab-preview-label-row slab-preview-spaced">
               <label for="offsetY">Vertical position</label>
               <span class="slab-preview-value" id="offsetYValue">0</span>
            </div>

            <input id="offsetY" type="range" min="-160" max="160" value="0" />
            <button id="resetBtn" class="slab-preview-button slab-preview-secondary" type="button">
               Reset Adjustments
            </button>
         </section>

      </section>
   </main>

   <!-- FOOTER -->
   <div id="footer-placeholder"></div>

   <script>
      fetch('../footer.html')
         .then(response => {
            if (!response.ok) {
               throw new Error('Footer failed to load');
            }

            return response.text();
         })
         .then(html => {
            document.getElementById('footer-placeholder').innerHTML = html;
         })
         .catch(error => {
            console.error(error);
         });
   </script>
   <!-- END FOOTER -->

   <script src="../slab-guard-preview.js"></script>
</body>

</html>
